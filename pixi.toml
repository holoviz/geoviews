[workspace]
name = "geoviews"
channels = ["pyviz/label/dev", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[environments]
default = [
    "required",
    "py312",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
    "lint",
    "dev",
]

[environments.test-310]
features = [
    "required",
    "py310",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
]
no-default-feature = true

[environments.test-311]
features = [
    "required",
    "py311",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
]
no-default-feature = true

[environments.test-312]
features = [
    "required",
    "py312",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
]
no-default-feature = true

[environments.test-313]
features = [
    "required",
    "py313",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
]
no-default-feature = true

[environments.test-314]
features = [
    "required",
    "py314",
    "optional",
    "test-core",
    "test-unit-task",
    "test-example",
    "download-data",
]
no-default-feature = true

[environments.test-core]
features = ["required", "py314", "test-core", "test-unit-task"]
no-default-feature = true

[environments.test-ui]
features = ["required", "py313", "optional", "test-core", "test-ui", "download-data"]
no-default-feature = true

[environments.docs]
features = ["required", "py311", "optional", "doc", "download-data"]
no-default-feature = true

[environments.build]
features = ["required", "py311", "build"]
no-default-feature = true

[environments.lint]
features = ["required", "lint"]
no-default-feature = true

[environments.download-data]
features = ["required", "download-data"]
no-default-feature = true

[feature.required.dependencies]
nomkl = "*"
pip = "*"
# Required
bokeh = ">=3.8.0"
cartopy = ">=0.18.0"
holoviews = ">=1.23.0a0" # Pinning because of tests
nodejs = ">=20"
numpy = "*"
packaging = "*"
panel = ">=1.0.0"
param = "*"
pyproj = "*"
shapely = ">=1.8.0"
xyzservices = "*"

[feature.required.tasks]
install = 'python -m pip install --no-deps --disable-pip-version-check -e .'
sync-git-tags = 'python scripts/sync_git_tags.py geoviews'

[feature.required.activation.env]
PYTHONIOENCODING = "utf-8"
USE_PYGEOS = "0"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py312.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py313.activation.env]
COVERAGE_CORE = "sysmon"

[feature.py314.dependencies]
python-gil = "*"
python = "3.14.*"

[feature.py314.activation.env]
COVERAGE_CORE = "sysmon"

[feature.download-data.tasks]
download-data = 'python scripts/download_data.py'

[feature.download-data.dependencies]
cftime = "*"
geodatasets = "*"
pooch = "*"
pyct = "*"
scipy = "*"
setuptools = "*" # Because of pyct
xarray = "*"

[feature.dev.dependencies]
jupyterlab = "*"
jupyterlab-myst = "*"
setuptools_scm = "*"

[feature.dev.tasks]
lab = 'jupyter lab'
setup-dev = { depends-on = ["install", "download-data", "lint-install"] }

# =============================================
# =================== TESTS ===================
# =============================================
[feature.test-core.dependencies]
psutil = "*"
pytest = "*"
pytest-cov = "*"
pytest-github-actions-annotate-failures = "*"
pytest-xdist = "*"

[feature.test-unit-task.tasks] # So it is not showing up in the test-ui environment
test-unit = 'pytest geoviews/tests -n logical --dist loadgroup'

[feature.optional.dependencies]
bokeh_sampledata = "*"
cftime = "*"
datashader = "*"
filelock = "*"
fiona = "*"
geopandas-base = "*"
iris = ">=3.5"
matplotlib-base = ">2.2"
nbval = "*"
netcdf4 = "*"
pandas = "*"
pyviz_comms = "*"
rioxarray = "*"
scipy = "*"
shapely = "*"
xarray = "*"

[feature.optional.target.unix.dependencies]
xesmf = "*" # https://github.com/conda-forge/esmf-feedstock/issues/138

[feature.test-example.tasks]
test-example = 'pytest -n logical --dist loadscope --nbval-lax examples'

[feature.test-example.dependencies]
nbval = "*"

[feature.test-ui.dependencies]
playwright = "*"
pytest-playwright = "*"

[feature.test-ui.tasks]
_install-ui = 'playwright install chromium'

[feature.test-ui.tasks.test-ui]
cmd = 'pytest geoviews/tests/ui --ui --browser chromium'
depends-on = ["_install-ui"]

# =============================================
# =================== DOCS ====================
# =============================================
[feature.doc.dependencies]
graphviz = "*"
lxml = "*"
nbsite = ">=0.8.4,<0.9.0"
numpydoc = "*"
selenium = "*"
sphinx-reredirects = "*"
matplotlib-base = "<3.11"  # 2026-07 until next cartopy release 0.25.0+

[feature.doc.activation.env]
MOZ_HEADLESS = "1"
MPLBACKEND = "Agg"
SPHINX_APIDOC_OPTIONS = "members,show-inheritance"

[feature.doc.tasks]
_docs-generate-rst = 'nbsite generate-rst --org holoviz --project-name geoviews'
_docs-generate = 'nbsite build --what=html --output=builtdocs --org holoviz --project-name geoviews'
_docs-refmanual = 'sphinx-apidoc -e -o doc/reference_manual/ geoviews/ geoviews/tests --ext-autodoc --ext-intersphinx'

[feature.doc.tasks.docs-build]
depends-on = ['_docs-generate-rst', '_docs-refmanual', '_docs-generate']

# =============================================
# ================== BUILD ====================
# =============================================
[feature.build.dependencies]
python-build = "*"
conda-build = "*"

[feature.build.tasks]
build-conda = 'bash scripts/conda/build.sh'
build-pip = 'python -m build .'
build-npm = { cmd = "npm pack .", cwd = "geoviews" }

# =============================================
# =================== LINT ====================
# =============================================
[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks]
lint = 'pre-commit run --all-files'
lint-install = 'pre-commit install'
lint-typescript = { cmd = "npm run lint", cwd = "geoviews" }
